[project]
name = "embedded-ai-copilot"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vlad Socaciu" }]
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.9.0,<0.10",
    "google-genai>=2.16.0",
    "httpx>=0.28.1",
    "numpy>=2.5,<3",
    "python-dotenv>=1.2.2",
    "tree-sitter>=0.26.0,<0.27",
    "tree-sitter-c>=0.24.2,<0.25",
    "tree-sitter-cpp>=0.23.4,<0.24",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead\\.:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:'_UnionGenericAlias' is deprecated and slated for removal in Python 3\\.17:DeprecationWarning:google\\.genai\\.types",
]
